# Google Pixel 8 (shiba) -- Tensor G3 (Zuma)
NAME="Google Pixel 8 (shiba)"
KIND=phone
SOC="Google Tensor G3 (Zuma)"

UEFI_TARGET=shiba
UEFI_FD=
DTB=
FD_BASE=0x9FD00000
FD_SIZE=0x200000
PAYLOAD_BASE=0xF0000000

FB_BASE=0x00000000              # Framebuffer reporting via UEFI GOP (1080 x 2400)
WIFI_ATH11K=0

# bootcpu=8: run on the Cortex-X3 big core (reg 0x800); cpus=9: 4x A510, 4x A715, 1x X3
# gpu=1 camtl=1 metal=1: Enable ARM Mali-G715 Immortalis GPU & Metal2Vulkan acceleration
BOOTARGS="touchscreen=1 cpufreq=1 bootcpu=8 cpus=9 gpu=1 camtl=1 metal=1 shiba_gpu=1"
DEFAULT_SECS=900
USERLAND_VARS=""
FIRMWARE="fw-gpu fw-wifi fw-audio fw-haptic"
